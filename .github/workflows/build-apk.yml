name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools/latest/bin" || true
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Center launcher icon within Android mask
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          path = 'app/src/main/res/drawable-nodpi/ic_launcher.jpg'
          original = Image.open(path).convert('RGB')
          canvas = Image.new('RGB', (512, 512), '#153f32')
          icon = original.resize((408, 408), Image.Resampling.LANCZOS)
          canvas.paste(icon, (52, 52))
          canvas.save(path, quality=95)
          PY
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Matematika-100-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Математика 1–100</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef5ff;color:#172b5a;font-family:Arial,sans-serif;padding:clamp(70px,14vh,140px) 20px 30px}
.stats,.modes,.answers{display:grid;gap:10px;margin-top:18px}.stats,.modes{grid-template-columns:repeat(3,minmax(0,1fr))}.answers{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat,.question,button,.panel{background:#fff;border-radius:18px;padding:16px;text-align:center}.stat{font-size:13px}.stat strong{display:block;font-size:28px;margin-top:5px}
button{font-size:18px;color:#172b5a;border:2px solid #ccd6e3;min-height:70px;font-weight:bold;touch-action:manipulation}.modes button{font-size:14px;min-height:58px;padding:8px}.active{background:#bfd9ff!important;border-color:#2874ef!important}
.question{font-size:clamp(34px,9vw,48px);font-weight:bold;margin-top:18px;padding:32px 4px}.panel{margin-top:14px;text-align:left}.panel h2{font-size:17px;margin:0 0 10px}
.timer-options{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.timer-options button{font-size:13px;min-height:43px;padding:4px}
.timer-line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}.timer-line button{min-height:43px;font-size:14px;padding:6px 12px}.clock{font-size:24px;font-weight:bold;font-variant-numeric:tabular-nums}
#reset{width:100%;border:0;background:transparent;font-size:15px;min-height:48px;margin-top:8px}
#summary{display:none;text-align:center;font-weight:bold;margin-top:15px;line-height:1.6}
.history-row{display:grid;grid-template-columns:1.1fr .8fr .8fr .8fr;gap:4px;padding:9px 0;border-bottom:1px solid #e1e8f0;font-size:13px;text-align:center}.history-row span:first-child{text-align:left}.history-row.head{font-weight:bold}
.muted{color:#62708d;font-size:13px}#answers button:disabled{opacity:.65}
</style></head><body>
<div class="stats"><div class="stat">Верно<strong id="ok">0</strong></div><div class="stat">Ошибки<strong id="bad">0</strong></div><div class="stat">Пример<strong id="num">1</strong></div></div>
<div class="panel"><h2>Режим тренировки</h2><div class="timer-options"><button data-time="0" class="active">Без времени</button><button data-time="60">1 мин</button><button data-time="180">3 мин</button><button data-time="300">5 мин</button></div>
<div class="timer-line"><span id="timerLabel" class="muted">Свободная тренировка</span><span class="clock" id="clock"></span><button id="timerAction" style="display:none">Начать</button></div></div>
<div class="modes"><button data-mode="mix" class="active">Вместе</button><button data-mode="plus">＋ Плюс</button><button data-mode="minus">− Минус</button></div>
<div class="question" id="question">12 + 7 = ?</div><div class="answers" id="answers"></div>
<div class="panel" id="summary"></div>
<button id="reset">Начать заново</button>
<div class="panel"><h2>Статистика по дням</h2><div class="muted">Сохраняется на этом телефоне. За последние 14 дней с тренировками.</div><div class="history-row head"><span>Дата</span><span>Верно</span><span>Ошибки</span><span>Точность</span></div><div id="history"></div></div>
<script>
(function(){
var $=function(id){return document.getElementById(id)},rand=function(a,b){return Math.floor(Math.random()*(b-a+1))+a};
var mode='mix',correct=0,errors=0,number=1,answer=0,locked=false,duration=0,deadline=0,timer=null,active=false,finished=false,advance=null;
var key='math100_daily_v1';
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function read(){try{var d=JSON.parse(localStorage.getItem(key)||'{}');return d&&typeof d==='object'?d:{}}catch(e){return {}}}
function record(win){var d=read(),k=today(),x=d[k]||{ok:0,bad:0};if(win)x.ok++;else x.bad++;d[k]=x;try{localStorage.setItem(key,JSON.stringify(d))}catch(e){}renderHistory()}
function renderHistory(){var d=read(),keys=Object.keys(d).sort().reverse().slice(0,14),box=$('history');box.innerHTML='';if(!keys.length){box.textContent='Пока нет результатов';return}keys.forEach(function(k){var x=d[k],a=Number(x.ok)||0,b=Number(x.bad)||0,row=document.createElement('div');row.className='history-row';[k.split('-').reverse().slice(0,2).join('.'),a,b,(a+b?Math.round(a/(a+b)*100):0)+'%'].forEach(function(v){var cell=document.createElement('span');cell.textContent=v;row.appendChild(cell)});box.appendChild(row)})}
function stats(){$('ok').textContent=correct;$('bad').textContent=errors;$('num').textContent=number}
function clearPending(){if(advance){clearTimeout(advance);advance=null}}
function makeQuestion(){clearPending();locked=false;var plus=mode==='plus'||(mode==='mix'&&Math.random()<.5),a=rand(1,100),b=rand(1,100);if(!plus&&a<b){var t=a;a=b;b=t}answer=plus?a+b:a-b;$('question').textContent=a+(plus?' + ':' − ')+b+' = ?';
var values=[answer];while(values.length<4){var n=answer+rand(-20,20);if(n>=0&&n<=200&&values.indexOf(n)<0)values.push(n)}for(var i=values.length-1;i>0;i--){var j=rand(0,i),t=values[i];values[i]=values[j];values[j]=t}
var box=$('answers');box.innerHTML='';values.forEach(function(v){var btn=document.createElement('button');btn.textContent=v;btn.onclick=function(){if(locked||finished||(duration&&!active))return;locked=true;var win=v===answer;if(win)correct++;else errors++;record(win);number++;stats();advance=setTimeout(function(){advance=null;if(!finished)makeQuestion()},90)};box.appendChild(btn)});stats()}
function stopClock(){if(timer){clearInterval(timer);timer=null}}
function displayClock(ms){var n=Math.max(0,Math.ceil(ms/1000));$('clock').textContent=Math.floor(n/60)+':'+('0'+n%60).slice(-2)}
function finish(){if(finished)return;finished=true;active=false;stopClock();clearPending();$('question').textContent='Время вышло!';$('answers').innerHTML='';$('summary').style.display='block';var total=correct+errors;$('summary').textContent='Результат: '+correct+' верно, '+errors+' ошибок. Точность: '+(total?Math.round(correct/total*100):0)+'%';$('timerAction').textContent='Повторить';$('timerAction').style.display='inline-block';$('timerLabel').textContent='Тренировка завершена';displayClock(0)}
function tick(){var left=deadline-Date.now();if(left<=0)finish();else displayClock(left)}
function start(){clearPending();stopClock();correct=0;errors=0;number=1;finished=false;active=true;$('summary').style.display='none';$('timerLabel').textContent='Осталось';$('timerAction').textContent='Заново';deadline=Date.now()+duration*1000;displayClock(duration*1000);makeQuestion();timer=setInterval(tick,200)}
function chooseTime(sec){duration=sec;stopClock();clearPending();finished=false;active=sec===0;correct=0;errors=0;number=1;$('summary').style.display='none';Array.prototype.forEach.call(document.querySelectorAll('[data-time]'),function(b){b.className=Number(b.getAttribute('data-time'))===sec?'active':''});
if(sec){$('timerLabel').textContent='Готов к старту';displayClock(sec*1000);$('timerAction').style.display='inline-block';$('timerAction').textContent='Начать';$('question').textContent='Нажми «Начать»';$('answers').innerHTML='';stats()}
else{$('timerLabel').textContent='Свободная тренировка';$('clock').textContent='';$('timerAction').style.display='none';makeQuestion()}}
Array.prototype.forEach.call(document.querySelectorAll('[data-time]'),function(b){b.onclick=function(){chooseTime(Number(b.getAttribute('data-time')))}})
Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'),function(b){b.onclick=function(){mode=b.getAttribute('data-mode');Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'),function(x){x.className=x===b?'active':''});if(!duration||active)makeQuestion()}})
$('timerAction').onclick=function(){if(duration)start()};
$('reset').onclick=function(){if(duration)chooseTime(duration);else chooseTime(0)};
document.addEventListener('visibilitychange',function(){if(!document.hidden&&active&&duration)tick()});
renderHistory();chooseTime(0)
})();
</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Математика 1–100</title><style>body{margin:0;background:#eef5ff;color:#172b5a;font-family:Arial,sans-serif;padding:20px}header{background:#172b5a;color:white;border-radius:24px;padding:20px;text-align:center}h1{margin:0 0 8px}header p{margin:0}.stats,.modes,.answers{display:grid;gap:10px;margin-top:18px}.stats,.modes{grid-template-columns:repeat(3,1fr)}.answers{grid-template-columns:repeat(2,1fr)}.stat,.question,button{background:white;border-radius:18px;padding:18px;text-align:center}.stat strong{display:block;font-size:28px}.stat{font-size:13px}button{font-size:19px;color:#172b5a;border:2px solid #ccd6e3;min-height:72px;font-weight:bold}.modes button{font-size:14px;min-height:60px;padding:8px}.modes .active{background:#bfd9ff;border-color:#2874ef}.question{font-size:42px;font-weight:bold;margin-top:22px;padding:35px 5px}.good{background:#c9f7d7!important;border-color:green}.bad{background:#ffd5d5!important;border-color:red}#message{text-align:center;min-height:30px;margin:22px 0;font-weight:bold}#next{background:#9dbaf6;color:white;width:100%}#next:disabled{opacity:.5}#reset{width:100%;border:0;background:transparent;font-size:15px;min-height:48px}</style></head><body><header><h1>🧮 Математика</h1><p>Сложение и вычитание от 1 до 100</p></header><div class="stats"><div class="stat">Верно<strong id="ok">0</strong></div><div class="stat">Ошибки<strong id="bad">0</strong></div><div class="stat">Пример<strong id="num">1</strong></div></div><div class="modes"><button data-mode="mix">Вместе</button><button data-mode="plus">＋ Плюс</button><button data-mode="minus">− Минус</button></div><div class="question" id="question">12 + 7 = ?</div><div class="answers" id="answers"></div><div id="message">Выбери ответ 👆</div><button id="next" disabled>Следующий пример →</button><button id="reset">Начать заново</button><script>(function(){var mode='mix',correct=0,errors=0,number=1,answer=19,done=false;var $=function(id){return document.getElementById(id)},random=function(a,b){return Math.floor(Math.random()*(b-a+1))+a};function next(){done=false;var plus=mode==='plus'||(mode==='mix'&&Math.random()<.5),a=random(1,100),b=random(1,100);if(!plus&&a<b){var t=a;a=b;b=t}answer=plus?a+b:a-b;$('question').textContent=a+(plus?' + ':' − ')+b+' = ?';var choices=[answer];while(choices.length<4){var n=answer+random(-20,20);if(n>=0&&n<=200&&choices.indexOf(n)<0)choices.push(n)}for(var i=choices.length-1;i>0;i--){var j=random(0,i),t=choices[i];choices[i]=choices[j];choices[j]=t}var area=$('answers');area.innerHTML='';choices.forEach(function(value){var button=document.createElement('button');button.textContent=value;button.onclick=function(){if(done)return;done=true;var win=value===answer;if(win)correct++;else errors++;$('ok').textContent=correct;$('bad').textContent=errors;$('message').textContent=win?'✅ Правильно! Молодец!':'❌ Правильный ответ: '+answer;Array.prototype.forEach.call(area.children,function(el){el.disabled=true;if(Number(el.textContent)===answer)el.className='good';else if(el===button)el.className='bad'});$('next').disabled=false};area.appendChild(button)});$('num').textContent=number;$('next').disabled=true;$('message').textContent='Выбери ответ 👆'}Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'),function(b){b.onclick=function(){mode=b.getAttribute('data-mode');Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'),function(x){x.className=x===b?'active':''});next()}});$('next').onclick=function(){if(!done)return;number++;next()};$('reset').onclick=function(){correct=0;errors=0;number=1;$('ok').textContent='0';$('bad').textContent='0';next()};document.querySelector('[data-mode=mix]').click()})();</script></body></html>
